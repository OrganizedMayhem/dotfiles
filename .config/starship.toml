"$schema" = 'https://starship.rs/config-schema.json'

# ---------------------------------------------------------------------------
# Core behavior
# ---------------------------------------------------------------------------
# Inserts a blank line between shell prompts
add_newline = true
command_timeout = 2000

# ---------------------------------------------------------------------------
# Custom layout — SRE/cloud/devops focused
# Left: identity, dir, git   |   Right (via $fill): cloud/k8s/tf/docker/lang
# Second line: duration, jobs, exit status, prompt char
# ---------------------------------------------------------------------------
format = """
$username\
$hostname\
$directory\
$git_branch\
$git_status\
$git_metrics\
$fill\
$azure\
$aws\
$gcloud\
$kubernetes\
$docker_context\
$terraform\
$nix_shell\
$conda\
$memory_usage\
$fill\
$time\
$cmd_duration\
$jobs\
$status\
$line_break\
$character
"""

[fill]
symbol = " "

[character]
success_symbol = "[❯](bold green)"
error_symbol = "[❯](bold red)"
vimcmd_symbol = "[❮](bold green)"

[username]
style_user = "bold dimmed blue"
style_root = "bold red"
format = "[$user]($style)@"
show_always = false

[hostname]
ssh_symbol = " "
ssh_only = true
format = "[$hostname](bold dimmed blue)[$ssh_symbol]($style) in "
trim_at = "."

[directory]
read_only = " 󰌾"
style = 'bold cyan'
truncation_length = 4
truncate_to_repo = true
format = "[$path]($style)[$read_only]($read_only_style) "

[directory.substitutions]
"~/homelab" = "🧪 homelab"
"~/.config" = "⚙️ cfg"

# ---------------------------------------------------------------------------
# Git
# ---------------------------------------------------------------------------
[git_branch]
symbol = " "
style = "bold purple"
format = "[$symbol$branch]($style) "
truncation_length = 24
truncation_symbol = "…"

[git_status]
style = "bold yellow"
format = '([\[$all_status$ahead_behind\]]($style) )'
conflicted = "🏳"
ahead = "⇡${count}"
behind = "⇣${count}"
diverged = "⇕⇡${ahead_count}⇣${behind_count}"
untracked = "?${count}"
stashed = "*${count}"
modified = "!${count}"
staged = "+${count}"
renamed = "»${count}"
deleted = "✘${count}"

[git_metrics]
added_style = "bold green"
deleted_style = "bold red"
format = '([+$added]($added_style) )([-$deleted]($deleted_style) )'
disabled = false

# ---------------------------------------------------------------------------
# Cloud — Azure primary (current role), AWS/GCP for other engagements
# ---------------------------------------------------------------------------
[azure]
symbol = "󰠅 "
style = "bold blue"
format = "[$symbol($subscription)]($style) "
disabled = false

[aws]
symbol = "  "
style = "bold yellow"
format = '[$symbol($profile)(\($region\))]($style) '
disabled = false

[gcloud]
symbol = "󱇶 "
style = "bold blue"
format = '[$symbol($account(@$domain)(\($project\)))]($style) '
disabled = false

# ---------------------------------------------------------------------------
# Kubernetes / IaC / containers
# ---------------------------------------------------------------------------
[kubernetes]
symbol = "󱃾 "
style = "cyan bold"
format = '[$symbol$context( \($namespace\))]($style) '
disabled = false

[kubernetes.context_aliases]
"gke_.*_(?P<cluster>[\\w-]+)" = "gke/$cluster"
"arn:aws:eks:.*:cluster/(?P<cluster>[\\w-]+)" = "eks/$cluster"

[terraform]
symbol = " "
style = "bold 105"
format = "[$symbol$workspace]($style) "
disabled = false

[docker_context]
symbol = " "
style = "blue dimmed"
format = "[$symbol$context]($style) "
only_with_files = true

# ---------------------------------------------------------------------------
# Nix / conda / memory — reproducible tooling & resource awareness
# ---------------------------------------------------------------------------
[nix_shell]
symbol = " "
style = "bold blue"
format = '[$symbol$state( \($name\))]($style) '

[conda]
symbol = " "
style = "bold green"
format = '[$symbol$environment]($style) '

[memory_usage]
symbol = "󰍛 "
style = "bold dimmed white"
format = "[$symbol${ram_pct}]($style) "
threshold = 75
disabled = false

# ---------------------------------------------------------------------------
# Time / duration / jobs / exit status — on-call & incident correlation
# ---------------------------------------------------------------------------
[time]
disabled = false
format = "🕐[$time]($style) "
time_format = "%R"
style = "dimmed white"

[cmd_duration]
min_time = 2000
format = "took [$duration]($style) "
style = "bold yellow"
show_milliseconds = false

[jobs]
symbol = "✦"
style = "bold blue"
number_threshold = 1
format = "[$symbol$number]($style) "

[status]
symbol = "✘ "
style = "bold red"
format = "[$symbol$status]($style) "
disabled = false

[battery]
full_symbol = "🔋"
charging_symbol = "🔌"
discharging_symbol = "⚡"

[[battery.display]]
threshold = 20
style = "bold red"

[line_break]
disabled = false

